<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact |Bhuwan Kumar</title>
    <meta name="description" content="Contact Bhuwan Kumar using a keyboard-accessible form.">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
        <div class="container">
            <a class="brand" href="index.html">Bhuwan Kumar</a>
            <nav aria-label="Primary navigation">
                <ul class="site-nav">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content" tabindex="-1">
        <section class="section" aria-labelledby="contact-title">
            <div class="container">
                <h1 id="contact-title">Contact Me</h1>
                <p>Use the form below to get in touch.</p>

                <form class="contact-form" action="#" method="post" aria-labelledby="contact-title">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>

                    <button type="submit">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container">
            <p>&copy; 2026  Bhuwan Kumar. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
