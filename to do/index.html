<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header class="app__header">
      <h1 class="app__title">TaskFlow</h1>
      <p class="app__subtitle">Stay on top of things, one task at a time.</p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        type="text"
        id="todo-input"
        class="todo-form__input"
        placeholder="What needs to be done?"
        maxlength="120"
        required
      />
      <button type="submit" class="todo-form__submit" aria-label="Add task">
        <span>+</span>
      </button>
    </form>

    <div class="toolbar">
      <div class="filters" id="filters" role="tablist" aria-label="Filter tasks">
        <button class="filters__btn is-active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filters__btn" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="filters__btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>
      <button id="clear-completed" class="toolbar__clear">Clear completed</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>
      No tasks here. Add one above to get started ✨
    </p>

    <footer class="app__footer">
      <span id="items-left">0 items left</span>
    </footer>
  </div>

  <template id="todo-item-template">
    <li class="todo-item" data-id="">
      <label class="todo-item__check-wrap">
        <input type="checkbox" class="todo-item__checkbox" />
        <span class="todo-item__check-mark" aria-hidden="true"></span>
      </label>

      <span class="todo-item__text"></span>

      <input type="text" class="todo-item__edit-input" maxlength="120" />

      <div class="todo-item__actions">
        <button class="todo-item__edit-btn" title="Edit task" aria-label="Edit task">✎</button>
        <button class="todo-item__delete-btn" title="Delete task" aria-label="Delete task">🗑</button>
      </div>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
