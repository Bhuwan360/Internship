[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hash routing means the app never needs a SPA rewrite rule — every
# path below index.html resolves client-side via #/route. Kept here
# only as a safety net for any bare (non-hash) deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
